name: Build UZGRAM APK

# Runs on demand from the Actions tab, and on every push to a build branch.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - 'claude/**'
      - 'build/**'

jobs:
  build:
    runs-on: ubuntu-latest
    # The native (NDK) build of four ABIs is the long pole here.
    timeout-minutes: 180

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The Android SDK, the NDK and the build outputs together outgrow the
      # runner's default free space, so reclaim what this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Versions are pinned to what the Gradle files ask for. CMake in
      # particular must be the SDK's 3.10.2 - the newer cmake already on the
      # runner is not what the build scripts request.
      - name: Install NDK and build tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.10.2.4988404"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        run: |
          VARIANT="${{ github.event.inputs.variant || 'release' }}"
          if [ "$VARIANT" = "debug" ]; then
            TASK=":TMessagesProj_App:assembleAfatDebug"
          else
            TASK=":TMessagesProj_App:assembleAfatRelease"
          fi
          echo "Running $TASK"
          chmod +x ./gradlew
          ./gradlew "$TASK" --no-daemon --stacktrace

      # The Gradle config renames every output to app.apk, so locate it rather
      # than assuming a path.
      - name: Locate APK
        id: apk
        run: |
          FOUND=$(find TMessagesProj_App/build/outputs -name '*.apk' | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "No APK produced" >&2
            find TMessagesProj_App/build/outputs -type f | head -50 >&2
            exit 1
          fi
          echo "path=$FOUND" >> "$GITHUB_OUTPUT"
          ls -lh "$FOUND"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uzgram-${{ github.event.inputs.variant || 'release' }}-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
